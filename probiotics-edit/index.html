<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="59.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- A-roll: Dr Dheeraj Mahar on probiotics, upscaled from 478x850, original sound -->
      <video
        id="a-roll"
        class="clip"
        src="assets/probiotics.mp4"
        playsinline
        data-has-audio="true"
        data-start="0"
        data-duration="57.5"
        data-track-index="0"
        style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: contain; z-index: 1"
      ></video>

      <!-- Scrim, panel and topic chip behind every scene -->
      <div id="frame" data-composition-id="frame" data-composition-src="compositions/frame.html"
        data-start="0" data-duration="54.9" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- One scene per section of the talk, all inside the panel -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="6.8" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="gut" data-composition-id="gut" data-composition-src="compositions/gut.html"
        data-start="6.6" data-duration="10.5" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="define" data-composition-id="define" data-composition-src="compositions/define.html"
        data-start="16.9" data-duration="8.1" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="strain" data-composition-id="strain" data-composition-src="compositions/strain.html"
        data-start="24.8" data-duration="6.3" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="evidence" data-composition-id="evidence" data-composition-src="compositions/evidence.html"
        data-start="30.9" data-duration="11.8" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="diet" data-composition-id="diet" data-composition-src="compositions/diet.html"
        data-start="42.5" data-duration="6.9" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="magic" data-composition-id="magic" data-composition-src="compositions/magic.html"
        data-start="49.2" data-duration="5.7" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <div id="lowerthird" data-composition-id="lowerthird" data-composition-src="compositions/lowerthird.html"
        data-start="0.5" data-duration="5.9" data-track-index="6" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 4"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="54.9" data-track-index="7" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="54.9" data-duration="4.6" data-track-index="8" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
